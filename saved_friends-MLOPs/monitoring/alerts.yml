groups:
  - name: food-delivery
    rules:
      - alert: DeliveryAPIDown
        expr: up{job="food-delivery"} == 0 or delivery_model_ready == 0
        for: 1m
        labels:
          severity: critical
      - alert: DeliveryErrors
        expr: rate(delivery_requests_total{status="error"}[5m]) / clamp_min(sum(rate(delivery_requests_total[5m])), 0.001) > 0.01
        for: 5m
      - alert: DeliveryLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(delivery_processing_seconds_bucket[5m]))) > 1
        for: 5m
      - alert: DeliveryDataDrift
        expr: delivery_data_drift == 1
        for: 5m
      - alert: DeliveryQualityDegraded
        expr: delivery_quality_degraded == 1
        for: 5m
